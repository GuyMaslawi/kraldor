<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="heebo.css">
<style>
  /* KRALDOR paid-social creatives.
     ============================================================================
     ONE source for nine exports: three concepts × three aspect ratios, picked
     off the query string (?c=reset|nostalgia|alliance&r=1x1|4x5|9x16). Nine
     separate files would drift the moment the brand moved; this cannot.

     Authored at 1080 wide always — only the HEIGHT changes between ratios, so
     type size, the crest and the skyline are shared and never need re-tuning
     per size. Everything that must move between ratios moves through the
     --pad/--scale custom properties set on #stage.

     Three things learned the hard way and encoded here (see brand/README.md):
       - RTL + letter-spacing puts the last glyph's trailing space on the LEFT,
         so centred spaced text is compensated with padding-RIGHT.
       - Screenshot at --force-device-scale-factor=1. The stage is 1080 wide and
         anything else doubles the export.
       - No `#id > *` positioning rule. Every layer places itself.

     Ad-specific constraints, which is where this departs from story.html:
       - **Little text.** Meta no longer refuses a text-heavy image, but it
         still delivers it to fewer people for the same money. One headline, one
         supporting line, one button. Everything else is the ad's caption, which
         lives in docs/marketing/ad-copy.md and costs nothing.
       - **Legible at 120px wide.** That is roughly the size of a feed thumbnail
         on a phone. The headline is huge on purpose and the lede is allowed to
         be unreadable at that size — if the headline does not survive the
         thumbnail, the ad has already lost.
       - **No URL burned into the 1:1 and 4:5.** The feed puts a real, clickable
         button under the image; a painted URL competes with it and cannot be
         tapped. Only the 9:16 story carries one, because a story does not.
  ============================================================================ */

  html,body{margin:0;padding:0;background:#08080b;overflow:hidden}

  #stage{
    position:relative;width:1080px;overflow:hidden;transform-origin:0 0;
    font-family:'Heebo',system-ui,sans-serif;direction:rtl;
    display:flex;flex-direction:column;align-items:center;
    background:
      radial-gradient(104% 40% at 50% -4%, rgba(150,120,40,.30), transparent 62%),
      radial-gradient(70% 26% at 12% 44%, rgba(26,24,30,.7), transparent 66%),
      radial-gradient(70% 26% at 88% 44%, rgba(26,24,30,.7), transparent 66%),
      linear-gradient(180deg,#100e0d 0%,#0b0a0b 48%,#070607 100%);
  }
  /* Per-ratio geometry. The 1:1 is the tightest and sets the floor; the taller
     ones simply get more breathing room rather than bigger type, because the
     same creative has to read as one campaign across all three placements. */
  #stage[data-r="1x1"] { height:1080px; --pad:104px; --gap:.82; --sky:250px }
  #stage[data-r="4x5"] { height:1350px; --pad:150px; --gap:1;   --sky:300px }
  #stage[data-r="9x16"]{ height:1920px; --pad:250px; --gap:1.3; --sky:390px }

  .layer{position:absolute;left:0;top:0;width:1080px;height:100%;pointer-events:none}
  .vig{background:
      linear-gradient(90deg,rgba(0,0,0,.66) 0%,transparent 22%,transparent 78%,rgba(0,0,0,.66) 100%),
      radial-gradient(120% 92% at 50% 40%, transparent 54%, rgba(0,0,0,.62) 100%);}

  /* The ornate frame, same treatment as the rest of the set so an ad and the
     Discord cover read as one brand. Inset further on the story, whose edges
     are eaten by the app's own chrome. */
  .frame{position:absolute;left:38px;top:38px;right:38px;bottom:38px;
    border:1px solid rgba(196,160,50,.32);
    box-shadow:inset 0 0 170px -85px rgba(196,160,50,.45)}
  .frame::after{content:"";position:absolute;left:12px;top:12px;right:12px;bottom:12px;
    border:1px solid rgba(214,201,173,.10)}
  .br{position:absolute;width:70px;height:70px;border:2px solid rgba(228,195,90,.68);
      box-shadow:0 0 18px -6px rgba(228,195,90,.6)}
  .br-tl{top:38px;left:38px;border-right:0;border-bottom:0}
  .br-tr{top:38px;right:38px;border-left:0;border-bottom:0}
  .br-bl{bottom:38px;left:38px;border-right:0;border-top:0}
  .br-br{bottom:38px;right:38px;border-left:0;border-top:0}

  /* The content column. `--pad` keeps it clear of the frame and, on the story,
     clear of Instagram's avatar and swipe-up chrome. */
  .safe{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
        width:100%;height:100%;padding:var(--pad) 70px;box-sizing:border-box;text-align:center}

  /* ---- the lockup, deliberately small ---- */
  /* On a landing page the crest is the hero. In a feed it is a signature: the
     headline has about half a second to do its work and the logo must not be
     what the eye lands on first. */
  .crest{filter:drop-shadow(0 16px 40px rgba(0,0,0,.95)) drop-shadow(0 0 46px rgba(196,160,50,.24))}
  .word{margin-top:16px;font-weight:900;font-size:48px;line-height:1;letter-spacing:.2em;
    color:#efe6ce;direction:ltr;padding-left:.2em;
    text-shadow:0 6px 30px rgba(0,0,0,.92), 0 0 56px rgba(196,160,50,.26)}
  .word b{color:#e4c35a}

  /* ---- the message ---- */
  .eyebrow{margin-top:calc(46px * var(--gap));font-weight:800;font-size:26px;letter-spacing:.3em;
    color:#0d0b09;padding:12px calc(28px + .3em) 12px 28px;border-radius:999px;
    background:linear-gradient(180deg,#e9cb68,#bf9a2c);
    box-shadow:0 12px 34px -12px rgba(228,195,90,.75), inset 0 1px 0 rgba(255,255,255,.45)}

  /* The one thing that has to survive a thumbnail. */
  .head{margin-top:calc(38px * var(--gap));font-weight:900;font-size:92px;line-height:1.1;
    color:#f3ecdb;max-width:900px;
    text-shadow:0 8px 44px rgba(0,0,0,.95), 0 0 80px rgba(196,160,50,.22)}
  .head b{color:#e4c35a}
  /* The nostalgia headline is a question and runs longer; it gets its own size
     rather than being allowed to wrap to four lines. */
  #stage[data-c="nostalgia"] .head{font-size:80px}

  .lede{margin-top:calc(28px * var(--gap));font-weight:500;font-size:37px;line-height:1.5;
    color:#cbbfa4;max-width:820px;text-shadow:0 3px 16px rgba(0,0,0,.9)}
  .lede b{color:#e4c35a;font-weight:800}

  .pills{display:flex;gap:15px;margin-top:calc(34px * var(--gap));flex-wrap:wrap;justify-content:center}
  /* The square has ~250px less height than the 4:5 and every one of them comes
     out of the middle. Something has to go, and the pills are the cheapest
     thing on the creative: they name features to somebody who has not yet been
     told why they should care, which is an argument the caption makes better.
     Dropping them also lets the skyline show under the button instead of being
     covered by it. */
  #stage[data-r="1x1"] .pills{display:none}
  .pill{font-weight:700;font-size:28px;color:#d6c9ad;padding:13px 28px;border-radius:999px;
    border:1px solid rgba(196,160,50,.40);background:rgba(196,160,50,.08);
    box-shadow:inset 0 0 26px -16px rgba(228,195,90,.9)}

  /* ---- the ask ---- */
  .cta{margin-top:auto;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3}
  .btn{font-weight:900;font-size:44px;letter-spacing:.02em;color:#100d07;
    padding:26px 70px;border-radius:20px;
    background:linear-gradient(180deg,#f0d478,#c4a032 55%,#a9861f);
    box-shadow:0 26px 56px -20px rgba(228,195,90,.7), 0 0 0 1px rgba(255,255,255,.22) inset,
               0 2px 0 rgba(255,255,255,.5) inset}
  .url{margin-top:26px;direction:ltr;font-weight:900;font-size:46px;letter-spacing:.09em;
    color:#e4c35a;text-shadow:0 4px 26px rgba(0,0,0,.95), 0 0 44px rgba(196,160,50,.42)}
  .note{margin-top:14px;font-weight:600;font-size:25px;letter-spacing:.04em;color:#9d9276}
  /* Only the story paints a URL — the feed placements get a real button. */
  #stage:not([data-r="9x16"]) .url,
  #stage:not([data-r="9x16"]) .note{display:none}

  .ember{position:absolute;border-radius:50%;background:#e4c35a;filter:blur(.6px);z-index:1}
</style>
</head>
<body>
<div id="stage">
  <svg class="layer" viewBox="0 0 1080 1080" preserveAspectRatio="none" id="sky"></svg>
  <div class="layer vig"></div>
  <div class="frame"></div>
  <i class="br br-tl"></i><i class="br br-tr"></i><i class="br br-bl"></i><i class="br br-br"></i>

  <div class="safe">
    <div class="crest" id="crest"></div>
    <div class="word">KRA<b>L</b>DOR</div>

    <div class="eyebrow" id="eyebrow"></div>
    <div class="head" id="head"></div>
    <div class="lede" id="lede"></div>
    <div class="pills" id="pills"></div>

    <div class="cta">
      <div class="btn" id="btn"></div>
      <div class="url">KRALDOR.COM</div>
      <div class="note" id="note"></div>
    </div>
  </div>
</div>

<script src="crest.js"></script>
<script>
/* ============================================================================
   The three concepts.

   They are three different ARGUMENTS, not three phrasings of one — which is the
   only way a three-creative test tells you anything. If all three said "build an
   empire" in different fonts, the winner would be a font, and nothing learned
   would survive into the next campaign.

     reset      the wipe. The objection-killer, and the only claim here a
                competitor cannot copy. Carries the launch burst.
     nostalgia  aimed at people who played this exact genre in Hebrew fifteen
                years ago and have been looking for it since. Narrowest
                audience, and on prior form the cheapest signup.
     alliance   the social hook. Produces signups in pairs, because the person
                it works on forwards it to the friend they would play with.

   `slug` is what goes in the ad's utm_content, so /admin/acquisition can say
   which of the three actually produced players. Keep them in sync with
   docs/marketing/ad-copy.md.
   ========================================================================== */
const CONCEPTS = {
  reset: {
    slug: 'reset',
    eyebrow: 'עונה חדשה',
    head: 'בעוד ימים ספורים<br><b>העולם נמחק</b>',
    lede: '30 יום. כולם מתחילים מ<b>אפס</b>.<br>מלך אחד בסוף.',
    pills: ['אימפריות', 'בריתות', 'מלחמה'],
    btn: 'תפסו מקום בשורת הזינוק',
    note: 'חינם · בדפדפן · בעברית',
  },
  nostalgia: {
    slug: 'nostalgia',
    eyebrow: 'זוכרים?',
    head: 'משחקי האסטרטגיה<br>של פעם — <b>חזרו</b>',
    lede: 'בדפדפן. בעברית. <b>בלי להוריד כלום.</b><br>נכנסים ומשחקים.',
    pills: ['בלי הורדה', 'בלי אפ־סטור', 'בלי פרסומות'],
    btn: 'שחקו עכשיו — בחינם',
    note: 'עובד במחשב ובנייד',
  },
  alliance: {
    slug: 'alliance',
    eyebrow: 'מפלצת העולם',
    head: 'היא לא נופלת<br><b>לבד</b>',
    lede: 'כל השרת מכה בה יחד.<br>תביאו <b>ברית</b>.',
    pills: ['מפלצת העולם', 'מלחמת בריתות', 'שליטי ערים'],
    btn: 'הצטרפו לקרב — בחינם',
    note: 'חינם · בדפדפן · בעברית',
  },
};

const params = new URLSearchParams(location.search);
const ratio = params.get('r') || '1x1';
const key = params.get('c') || 'reset';
const c = CONCEPTS[key];
if (!c) throw new Error(`unknown concept "${key}" — expected one of ${Object.keys(CONCEPTS)}`);

const stage = document.getElementById('stage');
stage.dataset.r = ratio;
stage.dataset.c = key;

document.getElementById('eyebrow').innerHTML = c.eyebrow;
document.getElementById('head').innerHTML = c.head;
document.getElementById('lede').innerHTML = c.lede;
document.getElementById('btn').textContent = c.btn;
document.getElementById('note').textContent = c.note;
document.getElementById('pills').innerHTML =
  c.pills.map((p) => `<span class="pill">${p}</span>`).join('');

/* The crest is a fixed 128 rather than scaled per ratio: it is a signature on
   every size, and a signature that changed size between placements would read
   as two different brands in one feed. */
document.getElementById('crest').innerHTML = crest('ad', 128);

/* ---------- the silhouetted war-scape along the bottom ----------
   Lifted from story.html and re-cut for a variable-height stage: everything is
   measured UP from the bottom edge (`H`) rather than down from the top, so the
   same code lands the skyline correctly at 1080, 1350 and 1920 without three
   tables of coordinates. It occupies --sky pixels and never reaches the text. */
const H = { '1x1': 1080, '4x5': 1350, '9x16': 1920 }[ratio];
const SKY = { '1x1': 250, '4x5': 300, '9x16': 390 }[ratio];
const sky = document.getElementById('sky');
sky.setAttribute('viewBox', `0 0 1080 ${H}`);

const P = [];
const push = (d, fill, extra = '') => P.push(`<path d="${d}" fill="${fill}" ${extra}/>`);

P.push(`<defs>
  <radialGradient id="hz" cx="0.5" cy="0.74" r="0.6">
    <stop offset="0"   stop-color="#d8b04a" stop-opacity="0.40"/>
    <stop offset="0.5" stop-color="#8f6a1c" stop-opacity="0.16"/>
    <stop offset="1"   stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#191521" stop-opacity="0"/>
    <stop offset="1" stop-color="#191521" stop-opacity="0.42"/>
  </linearGradient>
  <linearGradient id="pennant" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e4c35a"/><stop offset="1" stop-color="#a9861f"/>
  </linearGradient>
  <radialGradient id="gate" cx="0.5" cy="0.9" r="0.7">
    <stop offset="0" stop-color="#e4c35a" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#e4c35a" stop-opacity="0"/>
  </radialGradient>
</defs>`);

function citadel({ ground, wallTop, fill, towers, merlon, flags, lights }) {
  let wall = `M0,${ground} L0,${wallTop}`;
  for (let x = 0; x < 1080; x += merlon * 1.8) {
    wall += ` L${x},${wallTop} L${x},${wallTop - merlon * 0.55} ` +
            `L${x + merlon},${wallTop - merlon * 0.55} L${x + merlon},${wallTop}`;
  }
  wall += ` L1080,${wallTop} L1080,${ground} Z`;
  push(wall, fill);

  for (const [cx, hw, top, spire] of towers) {
    push(`M${cx-hw},${ground} L${cx-hw},${top} L${cx+hw},${top} L${cx+hw},${ground} Z`, fill);
    const lw = hw + merlon * 0.3, tooth = merlon * 0.5, step = merlon * 0.9;
    let cren = `M${cx-lw},${top+6} L${cx-lw},${top-tooth*0.5}`;
    for (let x = cx - lw; x < cx + lw; x += step) {
      cren += ` L${x},${top-tooth*0.5} L${x},${top-tooth*1.6} ` +
              `L${x+tooth},${top-tooth*1.6} L${x+tooth},${top-tooth*0.5}`;
    }
    cren += ` L${cx+lw},${top-tooth*0.5} L${cx+lw},${top+6} Z`;
    push(cren, fill);
    if (spire) {
      const apex = top - tooth * 1.6 - hw * 1.5;
      push(`M${cx-lw},${top-tooth*1.6} L${cx},${apex} L${cx+lw},${top-tooth*1.6} Z`, fill);
      if (flags && spire === 2) {
        push(`M${cx-2},${apex} L${cx+2},${apex} L${cx+2},${apex-36} L${cx-2},${apex-36} Z`, '#9c8748');
        push(`M${cx+2},${apex-34} L${cx+30},${apex-25} L${cx+2},${apex-16} Z`,
             'url(#pennant)', 'opacity="0.9"');
      }
    }
    if (lights) {
      const rows = Math.floor((ground - top - 40) / 46);
      for (let r = 0; r < rows; r++) {
        for (const s of [-1, 1]) {
          if ((r + (s > 0 ? 1 : 0) + cx) % 3 === 0) continue;
          const x = cx + s * hw * 0.42 - 3, y = top + 30 + r * 46;
          P.push(`<rect x="${x}" y="${y}" width="6" height="11" rx="3" fill="#e4c35a" opacity="${r === 0 ? 0.5 : 0.34}"/>`);
        }
      }
    }
  }
}

// Everything below is expressed as "N pixels up from the bottom", so the block
// travels with the stage height instead of being re-tabulated per ratio.
const up = (n) => H - n;

// FAR citadel — a paler ridge of towers to give the horizon depth.
citadel({
  ground: up(SKY * 0.36), wallTop: up(SKY * 0.52), fill: '#1b1726', merlon: 16, flags: false,
  towers: [[62, 20, up(SKY * 0.72), 0], [268, 24, up(SKY * 0.80), 1], [516, 18, up(SKY * 0.67), 0],
           [742, 24, up(SKY * 0.80), 1], [1010, 20, up(SKY * 0.72), 0]],
});
P.push(`<rect x="0" y="${up(SKY * 0.9)}" width="1080" height="${SKY * 0.72}" fill="url(#haze)"/>`);

// The amber battle-glow between the two citadels, which backlights the near one.
P.push(`<ellipse cx="540" cy="${up(SKY * 0.05)}" rx="640" ry="${SKY * 0.9}" fill="url(#hz)"/>`);

// NEAR citadel — lit from within.
citadel({
  ground: H, wallTop: up(SKY * 0.29), fill: '#0b0912', merlon: 26, flags: true, lights: true,
  towers: [[104, 36, up(SKY * 0.70), 2], [332, 42, up(SKY * 0.84), 1],
           [478, 26, up(SKY * 0.53), 0], [602, 26, up(SKY * 0.53), 0],   // the gatehouse pair
           [748, 42, up(SKY * 0.84), 1], [976, 36, up(SKY * 0.70), 2]],
});

// The gate: an arch of warm light between the gatehouse towers.
P.push(`<ellipse cx="540" cy="${H - 4}" rx="76" ry="104" fill="url(#gate)"/>`);
push(`M504,${H} L504,${up(54)} Q540,${up(94)} 576,${up(54)} L576,${H} Z`, '#f0d478', 'opacity="0.30"');
push(`M514,${H} L514,${up(50)} Q540,${up(82)} 566,${up(50)} L566,${H} Z`, '#0b0912', 'opacity="0.75"');

// Foreground ridge, so the very bottom edge is not a clean line.
push(`M0,${H} L0,${up(32)} L150,${up(46)} L320,${up(26)} L480,${up(42)} L660,${up(22)} ` +
     `L830,${up(44)} L980,${up(24)} L1080,${up(38)} L1080,${H} Z`, '#040306');

P.push(`<ellipse cx="540" cy="${up(34)}" rx="660" ry="${SKY * 0.55}" fill="url(#hz)" opacity="0.5"/>`);

sky.innerHTML = P.join('');

/* ---------- embers (fixed table, never random) ----------
   Expressed as fractions of the stage height so the same thirteen sparks sit
   sensibly in a square and in a story. */
[[146,.28,3,.32],[236,.52,2,.22],[912,.31,3,.30],[840,.55,2,.22],[128,.70,2,.20],
 [948,.72,2,.19],[300,.20,2,.20],[790,.22,2,.19],[540,.86,2,.22],[196,.90,3,.20],
 [880,.88,2,.19],[420,.94,2,.17],[672,.96,2,.17]].forEach(([x,fy,r,o]) => {
  const y = fy * H;
  const e = document.createElement('i');
  e.className = 'ember';
  e.style.cssText = `left:${x-r}px;top:${y-r}px;width:${r*2}px;height:${r*2}px;opacity:${o}`;
  stage.appendChild(e);
});

/* ---------- optional downscale for a smaller export via ?w= ---------- */
const w = Number(params.get('w') || 1080);
if (w !== 1080) stage.style.transform = `scale(${w / 1080})`;
</script>
</body>
</html>
